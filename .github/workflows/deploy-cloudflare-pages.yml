name: Cloudflare Pages deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  VITE_SUPABASE_URL: https://cgtlvfhvmhqpklkzbuma.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aRqwNXmqOME2F2ByHy58gA_86PkQk22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Keep production deployment gated until owner readiness
        if: vars.CF_PAGES_DEPLOY_ENABLED != 'true'
        run: echo 'Cloudflare production deploy is gated. Complete OWNER_GUIDE.md, then set CF_PAGES_DEPLOY_ENABLED=true.'

      - name: Deploy to Cloudflare Pages
        if: vars.CF_PAGES_DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kamna --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
